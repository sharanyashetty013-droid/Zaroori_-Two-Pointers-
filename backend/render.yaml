services:
  - type: web
    name: zaroori-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: zaroori-db, property: connectionString}
      - key: APP_ENV
        value: production
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: REVIEWER_API_KEY
        generateValue: true
      - key: VIEWER_API_KEY
        generateValue: true
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NGO_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
databases:
  - name: zaroori-db
    plan: free
